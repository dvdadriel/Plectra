<!doctype html>
<meta charset="utf-8">
<title>Plectra</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="/style.css">
<script>
  // Applied before first paint so a forced theme never flashes the other one.
  try {
    var t = localStorage.getItem('plectra-theme');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>

<header>
  <div class="bar">
    <h1 class="wordmark">Plectra</h1>
    <nav aria-label="Library">
      <button data-view="albums" aria-current="true">Albums</button>
      <button data-view="discover">Discover</button>
      <button data-view="radio">Radio</button>
      <button data-view="artists">Artists</button>
      <button data-view="playlists">Playlists</button>
      <button data-view="likes">Likes</button>
      <button data-view="queue">Queue</button>
      <button data-view="settings">Settings</button>
    </nav>
    <div class="tools">
      <label class="visually-hidden" for="q">Search library</label>
      <input id="q" type="search" placeholder="Search library" autocomplete="off">
      <button id="theme" class="ghost" type="button">Theme: system</button>
    </div>
  </div>
</header>

<main id="main" tabindex="-1"></main>

<footer>
  <div class="player">
    <button id="rail" type="button" aria-label="Seek"><div></div></button>
    <div class="readout">
      <span class="time" id="elapsed">0:00</span>
      <span id="now">Nothing playing</span>
      <span class="time" id="total"></span>
    </div>
    <div class="keys">
      <button class="key" id="prev" type="button" aria-label="Previous track"><svg viewBox="0 0 24 24" aria-hidden="true" width="18" height="18"><path fill="currentColor" d="M7 6h2v12H7zm3 6 8-6v12z"/></svg></button>
      <button class="key primary" id="toggle" type="button" aria-label="Play">&#9654;</button>
      <button class="key" id="next" type="button" aria-label="Next track"><svg viewBox="0 0 24 24" aria-hidden="true" width="18" height="18"><path fill="currentColor" d="M15 6h2v12h-2zM6 6l8 6-8 6z"/></svg></button>
    </div>
    <div class="extras">
      <button class="key" id="shuffle" type="button" aria-label="Shuffle" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true" width="17" height="17"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M4 7h3.5l2.5 3m4 4 2.5 3H20M4 17h3.5L16 7h4"/><path fill="currentColor" d="m17.5 4 3 3-3 3zm0 10 3 3-3 3z"/></svg></button>
      <button class="key" id="repeat" type="button" aria-label="Repeat: off" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true" width="17" height="17"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M7 7h10v4M17 17H7v-4"/><path fill="currentColor" d="m6 9-2.5-2L6 5zm12 6 2.5 2-2.5 2z"/></svg></button>
      <button class="key" id="like" type="button" aria-label="Like this track" aria-pressed="false">&#9825;</button>
      <span class="fader">
        <label class="visually-hidden" for="vol">Volume</label>
        <input id="vol" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume">
      </span>
    </div>
  </div>
</footer>

<script>
const $ = s => document.querySelector(s);

// A missing cover becomes a sleeve carrying the album's initial — something to
// read and to tell albums apart by, rather than an identical grey square.
function emptySleeve(img) {
  const div = document.createElement('div');
  div.className = 'art art-empty';
  div.textContent = img.dataset.initial || '?';
  div.setAttribute('aria-hidden', 'true');
  img.replaceWith(div);
}

const ICON = {
  play: '<svg viewBox="0 0 24 24" aria-hidden="true" width="18" height="18"><path fill="currentColor" d="M8 5.5v13l11-6.5z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" aria-hidden="true" width="18" height="18"><path fill="currentColor" d="M7 5h3.2v14H7zm6.8 0H17v14h-3.2z"/></svg>',
  heart: '<svg viewBox="0 0 24 24" aria-hidden="true" width="17" height="17"><path fill="none" stroke="currentColor" stroke-width="1.7" d="M12 20s-7-4.4-7-9.2A3.9 3.9 0 0 1 12 8a3.9 3.9 0 0 1 7 2.8C19 15.6 12 20 12 20Z"/></svg>',
  heartFull: '<svg viewBox="0 0 24 24" aria-hidden="true" width="17" height="17"><path fill="currentColor" d="M12 20s-7-4.4-7-9.2A3.9 3.9 0 0 1 12 8a3.9 3.9 0 0 1 7 2.8C19 15.6 12 20 12 20Z"/></svg>',
};
const get = p => fetch('/api' + p).then(r => r.ok ? r.json() : null);
const post = (p, body) => fetch('/api' + p, {method: 'POST', body: body && JSON.stringify(body)});
const del = p => fetch('/api' + p, {method: 'DELETE'});
const esc = s => String(s ?? '').replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));

// A duration of 0 means "not probed yet", not "zero seconds". Show nothing.
const mmss = ms => {
  if (!ms) return '';
  const s = Math.floor(ms / 1000);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
};

let view = 'albums', state = {}, liked = new Set(), searchTimer, playlistID = null;

/* ---- theme: system unless the listener forced one ---- */
const themeBtn = $('#theme');
function paintTheme() {
  const t = document.documentElement.dataset.theme || 'system';
  themeBtn.textContent = 'Theme: ' + t;
  themeBtn.setAttribute('aria-label', `Theme: ${t}. Click to change.`);
}
themeBtn.onclick = () => {
  const order = ['system', 'light', 'dark'];
  const next = order[(order.indexOf(document.documentElement.dataset.theme || 'system') + 1) % 3];
  if (next === 'system') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = next;
  try { next === 'system' ? localStorage.removeItem('plectra-theme') : localStorage.setItem('plectra-theme', next); } catch (e) {}
  paintTheme();
};
paintTheme();

/* ---- views ---- */

const albumGrid = albums => albums.length ? `<div class="grid">` + albums.map(a => `
  <div class="card" data-play='{"albumID":${a.id}}' tabindex="0" role="button"
       aria-label="Play ${esc(a.title)} by ${esc(a.artist)}">
    <img class="art" loading="lazy" src="/api/cover/${a.id}" alt=""
         data-initial="${esc((a.title || '?').trim()[0] || '?')}" onerror="emptySleeve(this)">
    <div class="t">${esc(a.title)}</div>
    <div class="s">${esc(a.artist)}${a.year ? ' · ' + a.year : ''}</div>
  </div>`).join('') + `</div>` : emptyState('No albums yet.', 'Point <code>-music</code> at a folder of audio files and they appear here as they are scanned.');

const skeletonGrid = (n = 8) => `<div class="skeleton-grid">${
  Array.from({length: n}, () => `<div><div class="skeleton skeleton-art"></div>
    <div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line short"></div></div>`).join('')
}</div>`;

const skeletonRows = (n = 8) => Array.from({length: n},
  () => '<div class="skeleton skeleton-row"></div>').join('');

const busy = (what) => `<p class="busy"><span class="spinner"></span>${esc(what)}</p>`;

// Every view paints a skeleton before it awaits anything, so the screen never
// sits on stale content and never jumps from empty to full without warning.
function showLoading(kind) {
  const m = $('#main');
  if (!m) return;
  m.innerHTML = kind === 'grid' ? skeletonGrid() : skeletonRows();
}

const emptyState = (title, detail) => `<p class="empty"><strong>${title}</strong><br><span class="sub">${detail}</span></p>`;

const trackList = (tracks, opts = {}) => tracks.length ? '<ul>' + tracks.map((t, i) => `
  <li class="${opts.queue && i === state.index ? 'playing' : ''}">
    <span class="no">${opts.queue || opts.playlist ? i + 1 : (t.trackNo || i + 1)}</span>
    <button class="grow" data-index="${(opts.offset || 0) + i}" data-list='${opts.queue ? 'queue' : 'tracks'}'>
      ${esc(t.title)} <span class="sub">— ${esc(t.artist)}</span>
    </button>
    <span class="dur">${mmss(t.durationMs)}</span>
    <button class="icon" data-like="${t.id}" aria-pressed="${liked.has(t.id)}"
            aria-label="${liked.has(t.id) ? 'Unlike' : 'Like'} ${esc(t.title)}">${liked.has(t.id) ? ICON.heartFull : ICON.heart}</button>
    ${opts.playlist ? `<button class="icon" data-remove="${t.id}" aria-label="Remove ${esc(t.title)} from playlist">✕</button>` : ''}
  </li>`).join('') + '</ul>' : emptyState('Nothing here yet.', 'Play something and it will show up.');

let listing = []; // what the current view would queue when a row is clicked

async function render() {
  showLoading(view === 'albums' || view === 'search' ? 'grid' : 'rows');
  liked = new Set(((await get('/likes')) || []).map(t => t.id));
  const m = $('#main');
  playlistID = null;

  if (view === 'albums') {
    listing = [];
    return m.innerHTML = albumGrid((await get('/albums')) || []);
  }
  if (view === 'artists') {
    const as = (await get('/artists')) || [];
    listing = [];
    return m.innerHTML = as.length ? '<ul>' + as.map(a => `
      <li><button class="grow" data-play='{"artistID":${a.id}}'>${esc(a.name)}</button></li>`).join('') + '</ul>'
      : emptyState('No artists yet.', 'They appear once the library is scanned.');
  }
  if (view === 'discover') {
    const sections = (await get('/discover')) || [];
    listing = sections.flatMap(s => s.tracks || []);
    if (!sections.length) {
      return m.innerHTML = emptyState('Nothing to suggest yet.',
        'Discover ranks your own library using what you actually play. Listen to a few things and come back.');
    }
    let offset = 0;
    return m.innerHTML = sections.map(sec => {
      const html = `<h2>${esc(sec.title)}</h2>
        <p class="sub">${esc(sec.reason)}</p>
        ${trackList(sec.tracks, {offset})}`;
      offset += sec.tracks.length;
      return html;
    }).join('');
  }
  if (view === 'radio') {
    listing = [];
    const q = $('#q').value.trim();
    const stations = (await get('/radio?limit=40' + (q ? '&q=' + encodeURIComponent(q) : ''))) || [];
    return m.innerHTML = stations.length ? `
      <h2>${q ? 'Stations matching ' + esc(q) : 'Most played stations'}</h2>
      <p class="sub">Full-length music from licensed broadcasters. Nothing is downloaded,
        and only stations Plectra can decode (MP3 and Ogg) are listed.</p>
      <ul>${stations.map(st => `
        <li>
          <button class="grow" data-station='${esc(JSON.stringify({url: st.url, name: st.name, uuid: st.uuid}))}'>
            ${esc(st.name)} <span class="sub">— ${esc(st.country || 'unknown')}${
              st.tags ? ' · ' + esc(st.tags.split(',').slice(0, 2).join(', ')) : ''}</span>
          </button>
          <span class="meta">${st.codec} ${st.bitrate}k</span>
        </li>`).join('')}</ul>`
      : emptyState('No stations found.',
          q ? 'Try a different name, or clear the search to see the most played stations.'
            : 'The station directory could not be reached.');
  }
  if (view === 'likes') {
    listing = (await get('/likes')) || [];
    return m.innerHTML = trackList(listing);
  }
  if (view === 'queue') {
    listing = state.queue || [];
    return m.innerHTML = trackList(listing, {queue: true});
  }
  if (view === 'playlists') {
    const ls = (await get('/playlists')) || [];
    listing = [];
    return m.innerHTML = `<button class="action" id="newpl">New playlist</button>` + (ls.length ? '<ul>' + ls.map(p => `
      <li>
        <button class="grow" data-open="${p.id}">${esc(p.name)}</button>
        <span class="meta">${p.trackCount} tracks</span>
        <button class="icon" data-play='{"playlistID":${p.id}}' aria-label="Play ${esc(p.name)}">▶</button>
        <button class="icon" data-delpl="${p.id}" aria-label="Delete ${esc(p.name)}">✕</button>
      </li>`).join('') + '</ul>'
      : emptyState('No playlists yet.', 'Create one, or import them from Spotify in Settings.'));
  }
  if (view === 'search') {
    const q = $('#q').value;
    const [r, src] = await Promise.all([get('/search?q=' + encodeURIComponent(q)), get('/source')]);
    listing = r?.tracks || [];
    const local =
      (r?.albums?.length ? '<h2>Albums</h2>' + albumGrid(r.albums) : '') +
      (r?.tracks?.length ? '<h2>Tracks</h2>' + trackList(r.tracks) : '');
    const online = src?.providers?.length
      ? `<h2>Not in your library</h2>
         <p class="sub">Search ${src.providers.join(', ')} for “${esc(q)}”. Nothing is downloaded;
            the stream is resolved when you press play and thrown away afterwards.</p>
         <button class="action" id="find-online" data-q="${esc(q)}">Search online</button>
         <div id="online"></div>`
      : '';
    return m.innerHTML = (local || emptyState('Nothing in your library matches.',
      src?.providers?.length ? 'You can still look outside it.' : 'Try another spelling.')) + online;
  }
  if (view === 'settings') return m.innerHTML = await settingsPanel();
}

// Scanning is something the user asks for, so the panel reports what the last
// scan did rather than implying the library keeps itself up to date.
function scanPanel(scan) {
  if (!scan) return '<p class="sub">The scanner is unavailable.</p>';
  const when = scan.finishedAt
    ? `Last scan ${new Date(scan.finishedAt * 1000).toLocaleString()}: ` +
      `${scan.scanned} added or updated, ${scan.skipped} unchanged` +
      (scan.failed ? `, ${scan.failed} failed` : '')
    : 'No scan yet in this session.';
  return `
    <p class="sub">${esc(scan.root || '')}</p>
    <p class="sub" id="scanwhen">${scan.running ? 'Scanning…' : esc(when)}</p>
    ${scan.error ? `<p class="sub">Last error: ${esc(scan.error)}</p>` : ''}
    <button class="action" id="scan"${scan.running ? ' disabled' : ''}>Sync local music</button>`;
}

// Credentials are entered here, never displayed back: the server only ever
// reports whether something is set.
function credentialsPanel(c) {
  if (!c) return '<p class="sub">Credentials cannot be edited on this instance.</p>';
  const mark = on => on
    ? '<span class="meta">saved</span>'
    : '<span class="meta">not set</span>';
  return `
    <p class="sub">Stored in your Plectra database and applied immediately — no restart.
      Values are never shown again after saving.</p>

    <div class="field">
      <label for="cred-lastfm">Last.fm API key ${mark(c.lastfmConfigured)}</label>
      <input class="path" id="cred-lastfm" type="password" autocomplete="off"
             placeholder="widens recommendations to artists without a MusicBrainz id">
    </div>
    <div class="field">
      <label for="cred-lb">ListenBrainz token ${
        c.listenbrainzConfigured && c.listenbrainzUser
          ? `<span class="meta">scrobbling as ${esc(c.listenbrainzUser)}</span>`
          : c.listenbrainzConfigured
            ? '<span class="meta">saved, but ListenBrainz rejected it</span>'
            : mark(false)}</label>
      <input class="path" id="cred-lb" type="password" autocomplete="off"
             placeholder="from listenbrainz.org/settings — not a MetaBrainz app secret">
    </div>

    <button class="action" id="save-creds">Save credentials</button>
    <div id="credresult" class="sub"></div>`;
}


async function settingsPanel() {
  const [enrich, hist, scan, creds] = await Promise.all([
    get('/enrich'), get('/history'), get('/library/scan'), get('/settings/credentials'),
  ]);
  return `
    <h2>Local music</h2>
    ${scanPanel(scan)}

    <h2>Metadata</h2>
    ${enrich
      ? `<p class="meta">${enrich.pending} pending · ${enrich.done} done · ${enrich.failed} failed</p>
         <button class="action" id="enrich">Run enrichment</button>
         <button class="action" id="reenrich">Re-run everything</button>`
      : `<p class="empty">Enrichment is off. Start with <code>-enrich</code> to turn it on.</p>`}
    <div id="enrichresult" class="sub"></div>

    <h2>Listening history</h2>
    ${hist
      ? `<p class="meta">${hist.total} plays recorded here${hist.unmatched ? ` · ${hist.unmatched} unmatched` : ''}</p>`
      : ''}
    <p class="sub">Recorded locally as you listen. It is what Discover ranks on.</p>
    ${hist && hist.unmatched ? '<button class="action" id="rematch">Rematch unmatched</button><div id="histresult" class="sub"></div>' : ''}

    <h2>Accounts</h2>
    ${credentialsPanel(creds)}

    <h2>Spotify playlists</h2>
    <p class="sub">Paste a public playlist link. No account, no login — Plectra reads
      the same page Spotify shows to anyone. Tracks you own play from your library;
      the rest can be played from an external source.</p>
    <input class="path" id="sp-url" placeholder="https://open.spotify.com/playlist/…">
    <div><button class="action" id="sp-load">Open playlist</button></div>
    <div id="sp-result"></div>`;
}

/* ---- interaction ---- */

$('#main').addEventListener('click', onMainClick);
$('#main').addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-play]')) {
    e.preventDefault();
    onMainClick(e);
  }
});

async function onMainClick(e) {
  // A track from a Spotify playlist: play the local file when there is one,
  // otherwise find it externally and play the best candidate.
  const sp = e.target.closest('[data-sp]');
  if (sp) {
    const info = JSON.parse(sp.dataset.sp);
    if (info.localId) return post('/player/play', {trackIDs: [info.localId], startIndex: 0});

    const row = sp.closest('li');
    const mark = row?.querySelector('.meta');
    if (mark) mark.innerHTML = '<span class="spinner"></span>';
    const found = await get('/source/find?artist=' + encodeURIComponent(info.artist) +
      '&title=' + encodeURIComponent(info.title));
    if (!found?.length) {
      if (mark) mark.textContent = 'not found';
      return;
    }
    const resp = await post('/source/play', found[0]);
    if (mark) mark.textContent = resp.ok ? 'playing' : 'failed';
    return;
  }

  const cand = e.target.closest('[data-candidate]');
  if (cand) {
    const el = cand.closest('#online, #sp-result') || $('#online');
    if (el) el.insertAdjacentHTML('afterbegin', `<div id="resolving">${busy('Resolving the stream…')}</div>`);
    const resp = await post('/source/play', JSON.parse(cand.dataset.candidate));
    document.querySelector('#resolving')?.remove();
    if (!resp.ok && el) el.insertAdjacentHTML('afterbegin', `<p class="sub">${esc(await resp.text())}</p>`);
    return;
  }

  const station = e.target.closest('[data-station]');
  if (station) return post('/radio/play', JSON.parse(station.dataset.station));

  const play = e.target.closest('[data-play]');
  if (play) return post('/player/play', JSON.parse(play.dataset.play));

  const row = e.target.closest('[data-index]');
  if (row) {
    const i = Number(row.dataset.index);
    const src = row.dataset.list === 'queue' ? (state.queue || []) : listing;
    if (!src.length) return;
    return post('/player/play', {trackIDs: src.map(t => t.id), startIndex: i});
  }

  const like = e.target.closest('[data-like]');
  if (like) {
    const id = Number(like.dataset.like);
    await (liked.has(id) ? del('/likes/' + id) : post('/likes/' + id));
    return render();
  }

  const open = e.target.closest('[data-open]');
  if (open) {
    playlistID = Number(open.dataset.open);
    listing = (await get('/playlists/' + playlistID)) || [];
    $('#main').innerHTML = trackList(listing, {playlist: true});
    return;
  }

  const rm = e.target.closest('[data-remove]');
  if (rm && playlistID) {
    await del(`/playlists/${playlistID}/tracks/${rm.dataset.remove}`);
    listing = (await get('/playlists/' + playlistID)) || [];
    $('#main').innerHTML = trackList(listing, {playlist: true});
    return;
  }

  const delpl = e.target.closest('[data-delpl]');
  if (delpl) { await del('/playlists/' + delpl.dataset.delpl); return render(); }

  if (e.target.id === 'newpl') {
    const name = prompt('Playlist name');
    if (name) { await post('/playlists', {name}); render(); }
    return;
  }

  if (e.target.id === 'find-online') {
    const q = e.target.dataset.q || '';
    e.target.disabled = true;
    $('#online').innerHTML = busy('Searching external sources — this asks yt-dlp, so give it a moment.');
    const found = (await get('/source/find?title=' + encodeURIComponent(q))) || [];
    e.target.disabled = false;
    if (!found.length) return $('#online').innerHTML = '<p class="sub">No results.</p>';
    $('#online').innerHTML = '<ul>' + found.map(c => `
      <li>
        <button class="grow" data-candidate='${esc(JSON.stringify(c))}'>
          ${esc(c.title)} <span class="sub">— ${esc(c.artist)}</span>
        </button>
        <span class="dur">${mmss(c.durationMs)}</span>
        <span class="meta">${esc(c.provider)}</span>
      </li>`).join('') + '</ul>';
    return;
  }
  if (e.target.id === 'sp-load') {
    const url = $('#sp-url').value.trim();
    if (!url) return $('#sp-result').innerHTML = '<p class="sub">Paste a playlist link first.</p>';
    e.target.disabled = true;
    $('#sp-result').innerHTML = busy('Reading the playlist from Spotify…');
    const resp = await fetch('/api/spotify/playlist', {method: 'POST', body: JSON.stringify({url})});
    e.target.disabled = false;
    if (!resp.ok) return $('#sp-result').innerHTML = `<p class="sub">${esc(await resp.text())}</p>`;
    const pl = await resp.json();
    $('#sp-result').innerHTML = `
      <h2>${esc(pl.name)}</h2>
      <p class="sub">${pl.tracks.length} tracks · ${pl.inLibrary} already in your library${
        pl.truncated ? ' · Spotify only hands over the first 25 without an account' : ''}</p>
      <ul>${pl.tracks.map((t, i) => `
        <li>
          <span class="no">${i + 1}</span>
          <button class="grow" data-sp='${esc(JSON.stringify({localId: t.localId || 0, artist: t.artist, title: t.title}))}'>
            ${esc(t.title)} <span class="sub">— ${esc(t.artist)}</span>
          </button>
          <span class="dur">${mmss(t.durationMs)}</span>
          <span class="meta">${t.localId ? 'library' : 'external'}</span>
        </li>`).join('')}</ul>`;
    return;
  }
  if (e.target.id === 'save-creds') {
    const body = {};
    const put = (field, id) => {
      const v = $(id).value.trim();
      if (v) body[field] = v;
    };
    put('lastfmApiKey', '#cred-lastfm');
    put('listenbrainzToken', '#cred-lb');
    if (!Object.keys(body).length) {
      return $('#credresult').textContent = 'Nothing entered. Fields left blank are kept as they are.';
    }
    e.target.disabled = true;
    const resp = await fetch('/api/settings/credentials', {method: 'POST', body: JSON.stringify(body)});
    e.target.disabled = false;
    if (!resp.ok) return $('#credresult').textContent = await resp.text();
    $('#credresult').textContent = 'Saved.';
    return render();
  }
  if (e.target.id === 'scan') {
    e.target.disabled = true;
    $('#scanwhen').textContent = 'Scanning…';
    await post('/library/scan');
    // Poll until it finishes: a cold library takes a while, and the button
    // should not claim success before the walk is over.
    const tick = setInterval(async () => {
      const s = await get('/library/scan');
      if (s && !s.running) {
        clearInterval(tick);
        render();
      }
    }, 700);
    return;
  }
  if (e.target.id === 'enrich' || e.target.id === 'reenrich') {
    const force = e.target.id === 'reenrich' ? '?force=1' : '';
    const r = await (await fetch('/api/enrich' + force, {method: 'POST'})).json();
    $('#enrichresult').textContent = `${r.queued} jobs queued — this runs in the background.`;
    return;
  }

  if (e.target.id === 'rematch') {
    const r = await (await fetch('/api/history/rematch', {method: 'POST'})).json();
    $('#histresult').textContent = `${r.claimed} plays claimed by tracks in your library.`;
    return;
  }

  if (e.target.id === 'imp-pl' || e.target.id === 'imp-liked') {
    const what = e.target.id === 'imp-liked' ? 'liked' : 'playlists';
    $('#impresult').textContent = 'Importing…';
    const resp = await fetch('/api/spotify/import?what=' + what, {method: 'POST'});
    if (!resp.ok) {
      const text = (await resp.text()).trim();
      $('#impresult').textContent = resp.status === 403
        ? text  // the server explains the development-mode user list
        : `${text} (HTTP ${resp.status})`;
      return;
    }
    const r = await resp.json();
    $('#impresult').textContent =
      `${r.matched} tracks matched${r.playlists ? ', ' + r.playlists + ' playlists' : ''}` +
      (r.unmatched?.length ? ` · ${r.unmatched.length} not in your library` : '') +
      (r.skipped?.length ? ` · Spotify would not share ${r.skipped.length} of its own playlists (${r.skipped.join(', ')})` : '');
  }
}

document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  view = b.dataset.view;
  $('#q').value = '';
  document.querySelectorAll('nav button').forEach(x => x.setAttribute('aria-current', String(x === b)));
  render();
});

$('#q').oninput = () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    if (view !== 'radio') view = $('#q').value.trim() ? 'search' : 'albums';
    render();
  }, 300);
};

$('#toggle').onclick = () => post(state.playing ? '/player/pause' : '/player/resume');
$('#prev').onclick = () => post('/player/prev');
$('#next').onclick = () => post('/player/next');
$('#shuffle').onclick = () => post('/player/mode', {shuffle: !state.shuffle, repeat: state.repeat || 'off'});
$('#repeat').onclick = () => post('/player/mode', {
  shuffle: !!state.shuffle,
  repeat: {off: 'all', all: 'one', one: 'off'}[state.repeat || 'off'],
});
$('#vol').oninput = e => post('/player/volume', {level: Number(e.target.value)});

$('#like').onclick = async () => {
  const t = state.queue?.[state.index];
  if (!t) return;
  await (liked.has(t.id) ? del('/likes/' + t.id) : post('/likes/' + t.id));
  liked.has(t.id) ? liked.delete(t.id) : liked.add(t.id);
  paint();
  if (view === 'likes' || view === 'queue') render();
};

$('#rail').onclick = e => {
  const t = state.queue?.[state.index];
  if (!t?.durationMs) return; // unknown duration: seeking would be a guess
  const r = $('#rail').getBoundingClientRect();
  post('/player/seek', {positionMs: Math.round((e.clientX - r.left) / r.width * t.durationMs)});
};

function paint() {
  const t = state.queue?.[state.index];
  $('#now').innerHTML = t
    ? `${esc(t.title)} <span class="by">— ${esc(t.artist)}</span>`
    : 'Nothing playing';
  $('#elapsed').textContent = mmss(state.positionMs) || '0:00';
  $('#total').textContent = t?.durationMs ? mmss(t.durationMs) : '';
  $('#rail').firstElementChild.style.setProperty('--progress',
    t?.durationMs ? Math.min(1, state.positionMs / t.durationMs) : 0);

  const playing = !!state.playing;
  $('#toggle').innerHTML = playing ? ICON.pause : ICON.play;
  $('#toggle').setAttribute('aria-label', playing ? 'Pause' : 'Play');

  $('#shuffle').setAttribute('aria-pressed', String(!!state.shuffle));
  const rep = state.repeat || 'off';
  $('#repeat').setAttribute('aria-pressed', String(rep !== 'off'));
  $('#repeat').setAttribute('aria-label', 'Repeat: ' + rep);
  $('#repeat').classList.toggle('one', rep === 'one');

  const isLiked = !!t && liked.has(t.id);
  $('#like').setAttribute('aria-pressed', String(isLiked));
  $('#like').classList.toggle('liked', isLiked);
  $('#like').innerHTML = isLiked ? ICON.heartFull : ICON.heart;
  $('#vol').value = state.volume ?? 1;
}

// The transport wraps differently at every width; measure it so content is never
// parked underneath it.
const transport = document.querySelector('footer');
const sizeTransport = () =>
  document.documentElement.style.setProperty('--player-h', transport.offsetHeight + 'px');
new ResizeObserver(sizeTransport).observe(transport);
sizeTransport();

new EventSource('/api/events').onmessage = e => {
  const ev = JSON.parse(e.data);
  if (ev.type === 'error') return console.warn('player:', ev.message);
  if (!ev.state) return;
  const prevIndex = state.index, prevLen = state.queue?.length;
  state = ev.state;
  paint();
  if (view === 'queue' && (state.index !== prevIndex || state.queue?.length !== prevLen)) render();
};

render();
</script>
