<!doctype html>
<meta charset="utf-8">
<title>Plectra</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/logo.png">
<link rel="stylesheet" href="/style.css">
<script>
  // Applied before first paint so a forced theme never flashes the other one.
  try {
    var t = localStorage.getItem('plectra-theme');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>

<header class="topbar">
  <div class="brand">
    <img src="/logo.png" alt="" width="26" height="27" id="mark">
    <span class="wordmark">Plectra</span>
  </div>
  <nav aria-label="Views">
    <button data-view="home" aria-current="true">Home</button>
    <button data-view="radio">Radio</button>
    <button data-view="find">Find</button>
  </nav>
  <div class="tools">
    <label class="visually-hidden" for="q">Search</label>
    <input id="q" type="search" placeholder="Artist, album, or track" autocomplete="off">
    <button id="theme" class="ghost icon-only" type="button" aria-label="Theme: system">
      <span class="theme-orb"><span class="theme-bite"></span></span>
    </button>
  </div>
</header>

<div class="shell">
  <aside class="rail" aria-label="Library">
    <p class="tagline">Your music, on your own machine.</p>
    <button data-view="playlists">
      <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h11M4 12h11M4 17h7"/><circle cx="18" cy="16" r="3"/><path d="M21 16V8"/></svg>
      Playlists
    </button>
    <button data-view="likes">
      <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" d="M12 20s-7-4.4-7-9.2A3.9 3.9 0 0 1 12 8a3.9 3.9 0 0 1 7 2.8C19 15.6 12 20 12 20Z"/></svg>
      Likes
    </button>
    <button data-view="settings">
      <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6l1.4 1.4m10 10 1.4 1.4m0-12.8-1.4 1.4m-10 10-1.4 1.4"/></svg>
      Settings
    </button>
  </aside>

  <main id="main" tabindex="-1"></main>

  <aside class="side" id="side" hidden>
    <section class="nowplaying" id="nowplaying" aria-label="Now playing"></section>
    <section class="queue-panel" id="queuepanel" aria-label="Queue"></section>
  </aside>
</div>

<footer class="player">
  <button id="rail" type="button" aria-label="Move through the track. Arrow keys jump five seconds."><div></div></button>
  <div class="now">
    <span class="np-art hue-0" id="nowart" aria-hidden="true"></span>
    <div class="now-text">
      <div class="now-title" id="now">Nothing playing</div>
      <div class="now-artist"><span id="elapsed">0:00</span><span id="total"></span></div>
    </div>
  </div>
  <div class="keys">
    <button class="key" id="prev" type="button" aria-label="Previous track"><svg viewBox="0 0 24 24" aria-hidden="true" width="18" height="18"><path fill="currentColor" d="M7 6h2v12H7zm3 6 8-6v12z"/></svg></button>
    <button class="key primary" id="toggle" type="button" aria-label="Play"></button>
    <button class="key" id="next" type="button" aria-label="Next track"><svg viewBox="0 0 24 24" aria-hidden="true" width="18" height="18"><path fill="currentColor" d="M15 6h2v12h-2zM6 6l8 6-8 6z"/></svg></button>
  </div>
  <div class="extras">
    <button class="key" id="shuffle" type="button" aria-label="Shuffle" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true" width="17" height="17"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M4 7h3.5l2.5 3m4 4 2.5 3H20M4 17h3.5L16 7h4"/><path fill="currentColor" d="m17.5 4 3 3-3 3zm0 10 3 3-3 3z"/></svg></button>
    <button class="key" id="repeat" type="button" aria-label="Repeat: off" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true" width="17" height="17"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M7 7h10v4M17 17H7v-4"/><path fill="currentColor" d="m6 9-2.5-2L6 5zm12 6 2.5 2-2.5 2z"/></svg></button>
    <button class="key" id="like" type="button" aria-label="Like this track" aria-pressed="false"></button>
    <label class="visually-hidden" for="vol">Volume</label>
    <input id="vol" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume">
  </div>
</footer>

<script>
const $ = s => document.querySelector(s);

// A missing cover becomes a sleeve carrying the album's initial — something to
// read and to tell albums apart by, rather than an identical grey square.
// A cover that fails to load leaves the sleeve, its colour and the initial —
// the same treatment as an album that never had artwork.
function emptySleeve(img) {
  const host = img.parentElement;
  if (!host) return;
  host.classList.add('empty');
  img.remove();
  host.insertAdjacentText('afterbegin', img.dataset.initial || '?');
}

const ICON = {
  play: '<svg viewBox="0 0 24 24" aria-hidden="true" width="18" height="18"><path fill="currentColor" d="M8 5.5v13l11-6.5z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" aria-hidden="true" width="18" height="18"><path fill="currentColor" d="M7 5h3.2v14H7zm6.8 0H17v14h-3.2z"/></svg>',
  heart: '<svg viewBox="0 0 24 24" aria-hidden="true" width="17" height="17"><path fill="none" stroke="currentColor" stroke-width="1.7" d="M12 20s-7-4.4-7-9.2A3.9 3.9 0 0 1 12 8a3.9 3.9 0 0 1 7 2.8C19 15.6 12 20 12 20Z"/></svg>',
  heartFull: '<svg viewBox="0 0 24 24" aria-hidden="true" width="17" height="17"><path fill="currentColor" d="M12 20s-7-4.4-7-9.2A3.9 3.9 0 0 1 12 8a3.9 3.9 0 0 1 7 2.8C19 15.6 12 20 12 20Z"/></svg>',
  pencil: '<svg viewBox="0 0 24 24" aria-hidden="true" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 20h4L20 8l-4-4L4 16z"/></svg>',
  trash: '<svg viewBox="0 0 24 24" aria-hidden="true" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg>',
  chevL: '<svg viewBox="0 0 24 24" aria-hidden="true" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  chevR: '<svg viewBox="0 0 24 24" aria-hidden="true" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
};
const get = p => fetch('/api' + p).then(r => r.ok ? r.json() : null);
const post = (p, body) => fetch('/api' + p, {method: 'POST', body: body && JSON.stringify(body)});
const del = p => fetch('/api' + p, {method: 'DELETE'});

// A track from a catalogue has no id until Plectra keeps a row for it. Keeping,
// queueing or filing one into a playlist is what asks for that row; from then
// on it is an ordinary track id and every other feature works on it unchanged.
const adopt = info => post('/external/adopt', {
  title: info.title, artist: info.artist,
  album: info.album || '', durationMs: info.durationMs || 0,
}).then(r => r.ok ? r.json() : null);
const esc = s => String(s ?? '').replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));

// A duration of 0 means "not probed yet", not "zero seconds". Show nothing.
const mmss = ms => {
  if (!ms) return '';
  const s = Math.floor(ms / 1000);
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
};

let view = 'home', state = {}, liked = new Set(), searchTimer, playlistID = null;

// Opening anything cancels what the last panel was still waiting for. A
// catalogue listing takes seconds; without this, the answer to a question
// nobody is asking any more lands inside the panel that replaced it, and the
// album you just opened shows the tracks of the one before it.
let nav = 0;
const claim = () => ++nav;
const stale = mine => mine !== nav;

/* ---- theme: system unless the listener forced one ---- */
const themeBtn = $('#theme');
// The control is one shape: a disc that the night takes a bite out of. System
// follows the OS, so the orb shows whichever the OS is currently giving.
function paintTheme() {
  const t = document.documentElement.dataset.theme || 'system';
  const dark = t === 'dark' ||
    (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
  themeBtn.dataset.mode = t;
  themeBtn.classList.toggle('is-dark', dark);
  themeBtn.setAttribute('aria-label',
    `Theme: ${t}. Click for ${{system: 'light', light: 'dark', dark: 'system'}[t]}.`);
}
themeBtn.onclick = () => {
  const root = document.documentElement;
  const order = ['system', 'light', 'dark'];
  const next = order[(order.indexOf(root.dataset.theme || 'system') + 1) % 3];

  // Every colour token changes at once. Without this the whole page runs its
  // hover transitions simultaneously and the switch visibly drags.
  root.classList.add('theme-swap');

  if (next === 'system') delete root.dataset.theme;
  else root.dataset.theme = next;
  try { next === 'system' ? localStorage.removeItem('plectra-theme') : localStorage.setItem('plectra-theme', next); } catch (e) {}
  paintTheme();

  // Two frames: one for the new tokens to paint, one before transitions are
  // allowed again, so nothing animates from the old colours.
  requestAnimationFrame(() => requestAnimationFrame(() => root.classList.remove('theme-swap')));
};
paintTheme();

/* ---- views ---- */

// An album keeps one of the four palette colours for the life of the library,
// derived from its id. Colour identifies a record here; it is not decoration,
// and nothing is randomised per render — the shelf looks the same every time.
const hueOf = key => {
  const n = typeof key === 'number' ? key : String(key ?? '')
    .split('').reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);
  return Math.abs(n) % 4;
};

// A missing cover becomes the album's own colour with its initial set large —
// something to recognise across a room rather than an identical grey square.
// `withPlay` is off by default: a search hit is itself a button, and a button
// inside a button is invalid markup that browsers resolve unpredictably.
const sleeve = (a, src, withPlay) => {
  const hue = hueOf(a.id || a.mbid || a.title);
  const initial = esc((a.title || '?').trim()[0] || '?');
  const btn = withPlay ? playBtn(a) : '';
  return src
    ? `<span class="sleeve hue-${hue}"><img loading="lazy" src="${esc(src)}" alt=""
         data-initial="${initial}" onerror="emptySleeve(this)">${btn}</span>`
    : `<span class="sleeve empty hue-${hue}">${initial}${btn}</span>`;
};

// A library album plays at once. A catalogue album has to be looked up first,
// so its button opens the album and starts the first track that resolves —
// the panel is where the waiting is visible.
const playBtn = a => a.id
  ? `<button class="pick" data-play='{"albumID":${a.id}}'
       aria-label="Play ${esc(a.title)}">${ICON.play}</button>`
  : `<button class="pick" data-playmb='${esc(JSON.stringify({mbid: a.mbid || a.id, title: a.title, artist: a.artist, cover: a.cover || ''}))}'
       aria-label="Play ${esc(a.title)}">${ICON.play}</button>`;

const albumCard = a => {
  // Only ask for artwork the library says it has: most albums here have none,
  // and a request per sleeve buys nothing but a 404.
  const src = a.id ? (a.hasCover ? `/api/cover/${a.id}` : '') : (a.cover || '');
  const open = a.id
    ? `data-open-album="${a.id}"`
    : `data-open-mb='${esc(JSON.stringify({mbid: a.mbid || a.id, title: a.title, artist: a.artist, cover: a.cover || ''}))}'`;
  return `<div class="card" ${open} tabindex="0" role="button"
       aria-label="Open ${esc(a.title)} by ${esc(a.artist)}">
    ${sleeve(a, src, true)}
    <span class="t">${esc(a.title)}</span>
    <span class="s">${esc(a.artist)}${a.year ? ' · ' + a.year : ''}</span>
  </div>`;
};

const albumGrid = albums => albums.length
  ? `<div class="grid">` + albums.map(albumCard).join('') + `</div>`
  : emptyState('The shelf is empty',
      'Choose the folder your music lives in, then press Look for music in Settings.');

// A row scrolls sideways, so it carries its own way to move: the arrows step by
// roughly a screenful and disable themselves at each end.
const albumRow = albums => !albums.length ? '' : `
  <div class="row-wrap">
    <button class="rowarrow left" data-scroll="-1" aria-label="Scroll left" tabindex="-1">${ICON.chevL}</button>
    <div class="grid row">${albums.map(albumCard).join('')}</div>
    <button class="rowarrow right" data-scroll="1" aria-label="Scroll right">${ICON.chevR}</button>
  </div>`;

const skeletonGrid = (n = 8) => `<div class="skeleton-grid">${
  Array.from({length: n}, () => `<div><div class="skeleton skeleton-art"></div>
    <div class="skeleton skeleton-line"></div><div class="skeleton skeleton-line short"></div></div>`).join('')
}</div>`;

const skeletonRows = (n = 8) => Array.from({length: n},
  () => '<div class="skeleton skeleton-row"></div>').join('');

const picks = '<span class="picks" aria-hidden="true"><i></i><i></i><i></i><i></i></span>';
const busy = what => `<p class="busy" role="status">${picks}${what ? esc(what) : ''}</p>`;

// Every view paints a skeleton before it awaits anything, so the screen never
// sits on stale content and never jumps from empty to full without warning.
function showLoading(kind) {
  const m = $('#main');
  if (!m) return;
  m.innerHTML = kind === 'grid' ? skeletonGrid() : skeletonRows();
}

const emptyState = (title, detail) => `<p class="empty"><strong>${title}</strong><br><span class="sub">${detail}</span></p>`;

const trackList = (tracks, opts = {}) => tracks.length ? '<ul>' + tracks.map((t, i) => `
  <li class="${opts.queue && i === state.index ? 'playing' : ''}">
    <span class="no">${opts.queue || opts.playlist
      ? (opts.offset || 0) + i + 1
      : (t.trackNo || (opts.offset || 0) + i + 1)}</span>
    <button class="grow" data-index="${(opts.offset || 0) + i}" data-list='${opts.queue ? 'queue' : 'tracks'}'>
      ${esc(t.title)} <span class="sub">— ${esc(t.artist)}</span>
    </button>
    <span class="dur">${mmss(t.durationMs)}</span>
    <button class="icon" data-like="${t.id}" aria-pressed="${liked.has(t.id)}"
            aria-label="${liked.has(t.id) ? 'Unlike' : 'Like'} ${esc(t.title)}">${liked.has(t.id) ? ICON.heartFull : ICON.heart}</button>
    ${opts.queue ? `<button class="icon" data-dequeue="${(opts.offset || 0) + i}" aria-label="Remove ${esc(t.title)} from queue">✕</button>`
                 : `<button class="icon" data-enq='{"trackIDs":[${t.id}]}' aria-label="Add ${esc(t.title)} to the queue">+</button>`}
    ${opts.playlist ? `<button class="icon" data-remove="${t.id}" aria-label="Remove ${esc(t.title)} from playlist">✕</button>` : ''}
  </li>`).join('') + '</ul>' : emptyState('Nothing queued', 'Play an album, or use Add to queue to line one up behind it.');

let listing = []; // what the current view would queue when a row is clicked

/* ---- search: local instantly, the catalogue when it arrives ---- */

const drop = Object.assign(document.createElement('div'), {className: 'drop', hidden: true});
drop.id = 'drop';
let searchAbort = null;

const closeDrop = () => { drop.hidden = true; drop.innerHTML = ''; };

// Local results come out of SQLite in single-digit milliseconds. Waiting for
// the catalogue before painting anything is what used to make this feel slow,
// so the two halves are drawn as they arrive rather than together.
async function suggest(q) {
  // Three characters: one or two match most of the library and cost a request
  // for an answer nobody wants.
  if (q.length < 3) return closeDrop();

  searchAbort?.abort();          // whatever the last keystroke started is stale
  const ac = new AbortController();
  searchAbort = ac;

  const paint = (localHTML, onlineHTML) => {
    if (ac.signal.aborted) return;
    drop.innerHTML = localHTML + onlineHTML;
    drop.hidden = !drop.innerHTML;
  };

  const cards = (albums, kind) => albums.map(a => {
    const open = kind === 'local'
      ? `data-open-album="${a.id}"`
      : `data-open-mb='${esc(JSON.stringify({mbid: a.id, title: a.title, artist: a.artist, cover: a.cover || ''}))}'`;
    const art = kind === 'local' ? (a.hasCover ? `/api/cover/${a.id}` : '')
      : (a.cover || (String(a.id).startsWith('dz:') ? '' : '/api/cover/rg/' + a.id));
    return `<button class="hit" ${open}>
      ${sleeve({id: kind === 'local' ? a.id : 0, mbid: a.id, title: a.title}, art)}
      <span class="hit-t">${esc(a.title)}</span>
      <span class="hit-s">${esc(a.artist)}</span>
    </button>`;
  }).join('');

  const section = (title, html) => html ? `<p class="drop-h">${title}</p><div class="hits">${html}</div>` : '';

  let localHTML = '';
  try {
    const r = await fetch('/api/search?q=' + encodeURIComponent(q), {signal: ac.signal})
      .then(res => res.ok ? res.json() : null);
    localHTML = section('In your library', cards(r?.albums || [], 'local')) +
      (r?.tracks?.length ? `<p class="drop-h">Tracks</p>` + r.tracks.slice(0, 6).map((t, i) => `
        <button class="hit row" data-hit-track="${t.id}">
          <span class="hit-t">${esc(t.title)}</span>
          <span class="hit-s">${esc(t.artist)}</span>
        </button>`).join('') : '');
  } catch (e) { if (e.name === 'AbortError') return; }
  paint(localHTML, `<p class="drop-h">Searching the catalogue…</p>`);

  try {
    const albums = await fetch('/api/browse?q=' + encodeURIComponent(q) + '&limit=12',
      {signal: ac.signal}).then(res => res.ok ? res.json() : []);
    paint(localHTML, section('Elsewhere', cards(albums || [], 'catalogue')) ||
      '<p class="drop-h">Nothing else found.</p>');
  } catch (e) {
    if (e.name === 'AbortError') return;
    paint(localHTML, '<p class="drop-h">The catalogue could not be reached.</p>');
  }
}

/* ---- paging ---- */

// One page size for every list. Long enough that most libraries need no paging
// at all, short enough that a 10,000-track Likes list does not build 10,000 DOM
// rows before the first one is visible.
const PAGE = 50;
let page = 0;

// What the pager repaints. The album panel and a playlist are drawn over #main
// without changing `view`, so render() alone would send Next back to the grid.
let repaint = () => render();

// Local lists are already in memory, so they are sliced here. Radio is the
// exception: its pages come from someone else's directory and are fetched.
const slice = items => items.slice(page * PAGE, (page + 1) * PAGE);

// Rendered only when there is a second page. A "Page 1 of 1" is noise.
function pager(hasMore, total) {
  if (page === 0 && !hasMore) return '';
  const from = page * PAGE + 1;
  const to = total != null ? Math.min((page + 1) * PAGE, total) : (page + 1) * PAGE;
  return `<nav class="pager" aria-label="Pages">
    <button class="action" data-page="${page - 1}"${page === 0 ? ' disabled' : ''}>← Previous</button>
    <span class="meta">${total != null ? `${from}–${to} of ${total}` : `Page ${page + 1}`}</span>
    <button class="action" data-page="${page + 1}"${hasMore ? '' : ' disabled'}>Next →</button>
  </nav>`;
}

// A paged list keeps its row indices absolute, so clicking row 3 of page 2
// still plays the right track out of `listing`.
function pagedList(items, opts = {}) {
  const shown = slice(items);
  return trackList(shown, {...opts, offset: (opts.offset || 0) + page * PAGE}) +
    pager((page + 1) * PAGE < items.length, items.length);
}

/* ---- album detail ---- */

// Painted over #main without touching `view`, so Back is just a re-render of
// wherever the listener came from — grid, search results or Find.
async function openAlbum(id) {
  const m = $('#main');
  const mine = claim();
  page = 0;
  repaint = () => openAlbum(id);
  m.innerHTML = skeletonRows();
  const al = await get('/albums/' + id);
  if (stale(mine)) return;
  if (!al) return m.innerHTML = emptyState('That album has gone.', 'It may have left your collection since this page opened.');

  listing = al.tracks || [];
  const total = listing.reduce((sum, t) => sum + (t.durationMs || 0), 0);
  const ids = listing.map(t => t.id);

  m.innerHTML = `
    <div class="album-head">
      ${sleeve(al, al.hasCover ? `/api/cover/${al.id}` : '')}
      <div class="album-meta">
        <button class="ghost" id="albumback">← Back</button>
        <h2>${esc(al.title)}</h2>
        <p class="sub">${esc(al.artist)}${al.year ? ' · ' + al.year : ''} ·
          ${listing.length} track${listing.length === 1 ? '' : 's'}${total ? ' · ' + mmss(total) : ''}</p>
        <div class="actions">
          <button class="action primary" data-play='{"albumID":${al.id}}'>Play</button>
          <button class="action" id="albumshuffle">Shuffle</button>
          <button class="action" data-enq='{"albumID":${al.id}}'>Add to queue</button>
        </div>
      </div>
    </div>
    ${pagedList(listing)}`;

  // Shuffled here rather than by turning on shuffle mode: that only reorders
  // what comes after the current track, so track 1 would always open the album.
  $('#albumshuffle').onclick = () => {
    const order = ids.slice();
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    post('/player/play', {trackIDs: order, startIndex: 0});
  };
  $('#albumback').onclick = () => render();
}

// The same panel for an album Plectra does not own. The track listing comes from
// MusicBrainz, and each row is marked with whether it will play from disk or has
// to be resolved through an external source — so nobody presses play on a row
// that is going to take five seconds without warning.
async function openCatalogueAlbum(info, autoplay) {
  const m = $('#main');
  const mine = claim();
  page = 0;
  repaint = () => openCatalogueAlbum(info, false);
  m.innerHTML = skeletonRows();


  m.innerHTML = `
    <div class="album-head">
      ${sleeve(info, info.cover)}
      <div class="album-meta">
        <button class="ghost" id="albumback">← Back</button>
        <h2>${esc(info.title)}</h2>
        <p class="sub">${esc(info.artist)}</p>
      </div>
    </div>
    <div id="album-tracks">${busy('')}</div>`;
  $('#albumback').onclick = () => render();

  const tracks = (await get('/browse/album?id=' + encodeURIComponent(info.mbid))) || [];
  if (stale(mine)) return; // the listener opened something else while the catalogue thought
  const box = $('#album-tracks');
  if (!box) return;
  if (!tracks.length) {
    box.innerHTML = '<p class="sub">The track list for this album did not come through. Try again, or play it as it stands.</p>';
    return;
  }
  // Every row carries what it takes to keep it, whether or not the file is on
  // disk: a track Plectra does not own is given a library row the moment it is
  // liked or queued, so nothing here is a second-class song.
  box.innerHTML = '<ul>' + tracks.map(t => {
    const sp = {localId: t.localId || 0, artist: t.artist, title: t.title,
                album: info.title, durationMs: t.durationMs || 0};
    const on = !!t.localId && liked.has(t.localId);
    return `<li>
      <span class="no">${t.position || ''}</span>
      <button class="grow" data-sp='${esc(JSON.stringify(sp))}'>
        ${esc(t.title)} <span class="sub">— ${esc(t.artist)}</span>
      </button>
      <span class="dur">${mmss(t.durationMs)}</span>
      <span class="meta" data-mark="${t.localId ? 'library' : 'external'}">${t.localId ? 'library' : 'external'}</span>
      <button class="icon" data-splike aria-pressed="${on}"
              aria-label="${on ? 'Unlike' : 'Like'} ${esc(t.title)}">${on ? ICON.heartFull : ICON.heart}</button>
      <button class="icon" data-spenq aria-label="Add ${esc(t.title)} to the queue">+</button>
    </li>`;
  }).join('') + '</ul>';

  // Play arrived from a card, so start the album without a second click. The
  // row marks itself while the stream is resolved, which is the only honest
  // way to show a wait that can run to several seconds.
  if (autoplay) box.querySelector('[data-sp]')?.click();
}

async function render() {
  const mine = claim();
  repaint = () => render();
  showLoading(view === 'home' || view === 'albums' ? 'grid' : 'rows');
  liked = new Set(((await get('/likes')) || []).map(t => t.id));
  if (stale(mine)) return;
  const m = $('#main');
  playlistID = null;

  if (view === 'home') {
    listing = [];
    const sections = (await get('/home')) || [];
    if (!sections.length) {
      return m.innerHTML = emptyState('The shelf is empty',
        'Choose the folder your music lives in, then press Look for music in Settings.');
    }
    return m.innerHTML = sections.map(sec => `<h2>${esc(sec.title)}</h2>
      <p class="sub">${esc(sec.reason)}${sec.more && sec.total > sec.albums.length
        ? ` <button class="linky" data-view-all="${esc(sec.more)}">See all ${sec.total}</button>`
        : ''}</p>
      ${albumRow(sec.albums)}`).join('');
  }
  if (view === 'albums') {
    listing = [];
    const r = (await get(`/albums?limit=${PAGE}&offset=${page * PAGE}`)) || {};
    const albums = r.albums || [];
    return m.innerHTML = `<h2>Your library</h2>
      <p class="sub">Everything you own, in order of artist.</p>
      ${albumGrid(albums)}
      ${pager((page + 1) * PAGE < (r.total || 0), r.total)}`;
  }
  if (view === 'radio') {
    listing = [];
    const q = $('#q').value.trim();
    const r = (await get(`/radio?limit=${PAGE}&offset=${page * PAGE}` +
      (q ? '&q=' + encodeURIComponent(q) : ''))) || {};
    const stations = r.stations || [];
    return m.innerHTML = stations.length ? `
      <h2>${q ? 'Stations matching ' + esc(q) : 'Most played stations'}</h2>
      <p class="sub">Stations playing music in full, straight through. Nothing is saved to
        your machine, and stations Plectra cannot play are left out.</p>
      <ul>${stations.map(st => `
        <li>
          <button class="grow" data-station='${esc(JSON.stringify({url: st.url, name: st.name, uuid: st.uuid}))}'>
            ${esc(st.name)} <span class="sub">— ${esc(st.country || 'unknown')}${
              st.tags ? ' · ' + esc(st.tags.split(',').slice(0, 2).join(', ')) : ''}</span>
          </button>
          <span class="meta">${st.codec} ${st.bitrate}k</span>
        </li>`).join('')}</ul>
      ${pager(r.more)}`
      : (page > 0
          ? `<p class="sub">That is every station.</p>${pager(false)}`
          : emptyState(q ? 'Nothing by that name' : 'The directory is not answering',
              q ? 'No station matches. Try a shorter piece of the name.'
                : 'Plectra could not reach the station list. Check the connection and try again.'));
  }
  if (view === 'find') {
    listing = [];
    // Both come from endpoints the other views already use; Find is an
    // arrangement of them, not a new source.
    const [pls, sections] = await Promise.all([get('/playlists'), get('/home')]);
    const lists = pls || [];

    // The rows worth surfacing here are the ones that suggest something, as
    // opposed to the ones that merely list what is already on disk.
    const suggest = (sections || []).filter(sec =>
      ['Out of your own history', 'Out in the world', 'Elsewhere this week'].includes(sec.title));

    const playlists = lists.length ? `
      <h2>Your playlists</h2>
      <p class="sub">${lists.length} playlist${lists.length === 1 ? '' : 's'}${
        lists.length > 8 ? ` <button class="linky" data-view-all="playlists">See all</button>` : ''}</p>
      <ul>${lists.slice(0, 8).map(p => `
        <li>
          <button class="grow" data-open="${p.id}">${esc(p.name)}</button>
          <span class="meta">${p.trackCount} tracks</span>
          <button class="icon" data-play='{"playlistID":${p.id}}' aria-label="Play ${esc(p.name)}">${ICON.play}</button>
          <button class="icon" data-enq='{"playlistID":${p.id}}' aria-label="Add ${esc(p.name)} to the queue">+</button>
        </li>`).join('')}</ul>`
      : `<h2>Your playlists</h2>
         <p class="sub">None yet. Make your first one in Playlists.</p>`;

    const recs = suggest.length
      ? suggest.map(sec => `<h2>${esc(sec.title)}</h2>
          <p class="sub">${esc(sec.reason)}</p>
          ${albumRow(sec.albums)}`).join('')
      : `<h2>Nothing to suggest yet</h2>
         <p class="sub">These grow out of the things you play all the way through.
           Listen to a few and they turn up here.</p>`;

    return m.innerHTML = playlists + recs;
  }
  if (view === 'likes') {
    listing = (await get('/likes')) || [];
    if (!listing.length) {
      return m.innerHTML = emptyState('Nothing kept yet', 'Like a track or an album and it gathers here.');
    }
    const ids = listing.map(t => t.id);
    return m.innerHTML = `<h2>Kept</h2>
      <p class="sub">${listing.length} track${listing.length === 1 ? '' : 's'} you liked, most recent first.</p>
      <div class="actions">
        <button class="action primary" data-playids='${esc(JSON.stringify(ids))}'>Play</button>
        <button class="action" id="likeshuffle" data-ids='${esc(JSON.stringify(ids))}'>Shuffle</button>
        <button class="action" data-enq='{"trackIDs":${JSON.stringify(ids)}}'>Add to queue</button>
      </div>` + pagedList(listing);
  }
  if (view === 'queue') {
    listing = state.queue || [];
    // The page holding what is playing, so the queue does not open on page 1
    // while track 300 is in the speakers.
    if (state.index >= 0) page = Math.floor(state.index / PAGE);
    return m.innerHTML = pagedList(listing, {queue: true});
  }
  if (view === 'playlists') {
    const ls = (await get('/playlists')) || [];
    listing = [];
    // Everything happens in the page. A browser prompt() is a modal dialog the
    // product never styled, cannot be cancelled with Escape consistently, and
    // looks like a phishing box on a self-hosted tool.
    return m.innerHTML = `
      <h2>Playlists</h2>
      <p class="sub">Yours to build. Right-click any track to drop it into one.</p>
      <form class="newpl" id="newpl">
        <input id="plname" placeholder="Name a new playlist" maxlength="120" autocomplete="off">
        <button class="action primary" type="submit">Create</button>
      </form>
      ${ls.length ? '<ul>' + slice(ls).map(p => `
        <li data-pl="${p.id}">
          <button class="grow" data-open="${p.id}">${esc(p.name)}</button>
          <span class="meta">${p.trackCount} track${p.trackCount === 1 ? '' : 's'}</span>
          <button class="icon" data-play='{"playlistID":${p.id}}' aria-label="Play ${esc(p.name)}">${ICON.play}</button>
          <button class="icon" data-enq='{"playlistID":${p.id}}' aria-label="Add ${esc(p.name)} to the queue">+</button>
          <button class="icon" data-renamepl="${p.id}" data-name="${esc(p.name)}" aria-label="Rename ${esc(p.name)}">${ICON.pencil}</button>
          <button class="icon" data-delpl="${p.id}" aria-label="Delete ${esc(p.name)}">${ICON.trash}</button>
        </li>`).join('') + '</ul>' + pager((page + 1) * PAGE < ls.length, ls.length)
        : emptyState('No playlists yet', 'Name one above, then right-click any track to put it inside.')}`;
  }
  if (view === 'settings') return m.innerHTML = await settingsPanel();
}

// Scanning is something the user asks for, so the panel reports what the last
// scan did rather than implying the library keeps itself up to date.
function scanPanel(scan) {
  if (!scan) return '<p class="sub">Plectra cannot look through your folder right now.</p>';
  const when = scan.finishedAt
    ? `Looked ${new Date(scan.finishedAt * 1000).toLocaleString()}: ` +
      `${scan.scanned} added or changed, ${scan.skipped} already here` +
      (scan.failed ? `, ${scan.failed} could not be read` : '')
    : 'Not looked through yet.';
  return `
    <p class="sub">${esc(scan.root || '')}</p>
    <p class="sub" id="scanwhen">${scan.running ? 'Looking through your folder…' : esc(when)}</p>
    ${scan.error ? `<p class="sub">Last time something went wrong: ${esc(scan.error)}</p>` : ''}
    <button class="action" id="scan"${scan.running ? ' disabled' : ''}>Look for music</button>`;
}



// The password that unlocks setup, held for this page only. It is a credential
// on an interface that has none of its own, so it never goes to storage a later
// visitor could read.
let setupKey = '';

// What can be configured is described by the server, so a new key is one entry
// in Go rather than the same entry in two languages.
async function setupPanel() {
  const res = await fetch('/api/settings',
    {headers: setupKey ? {'X-Plectra-Password': setupKey} : {}});

  if (res.status === 403) {
    return `
      <h2>Setup</h2>
      <p class="sub">Locked. Enter the listening password to change these, or
         open Plectra on the machine it runs on.</p>
      <form class="setupform" id="unlock">
        <input type="password" name="k" placeholder="Listening password" autocomplete="current-password">
        <button class="action" type="submit">Unlock</button>
      </form>`;
  }
  if (!res.ok) return '<h2>Setup</h2><p class="sub">Setup is unavailable.</p>';

  const cfg = await res.json();
  return `
    <h2>Setup</h2>
    <p class="sub">Everything here is optional except the music folder.</p>
    <form class="setupform" id="setup">
      ${cfg.fields.map(f => `
        <label class="setuprow">
          <span class="setuplabel">${esc(f.label)}
            <em>${f.set ? 'set' : 'not set'}</em>
            ${f.live ? '' : '<em>starts next time</em>'}</span>
          <input name="${esc(f.name)}" type="${f.secret ? 'password' : 'text'}"
                 value="${esc(f.value || '')}"
                 oninput="this.dataset.typed = '1'"
                 autocomplete="${f.secret ? 'new-password' : 'off'}"
                 placeholder="${f.set && f.secret ? 'Leave blank to keep' : 'Not set'}">
          <span class="sub">${esc(f.help)}${f.link
            ? ` <a href="${esc(f.link)}" target="_blank" rel="noopener noreferrer">Get one</a>.` : ''}</span>
        </label>`).join('')}
      <button class="action primary" type="submit">Save</button>
    </form>
    <h2>On your phone</h2>
    ${cfg.mobile.ready
      ? `<p class="sub">Install any Subsonic app on your phone, then give it these. Both devices
           need to be on the same network.</p>
         <dl class="conn">
           <dt>Address</dt><dd><code>${esc(cfg.mobile.url)}</code></dd>
           <dt>Username</dt><dd><code>${esc(cfg.mobile.user)}</code></dd>
           <dt>Password</dt><dd>the listening password above</dd>
         </dl>`
      : `<p class="sub">${esc(cfg.mobile.note)}</p>`}`;
}

async function settingsPanel() {
  const [scan, setup] = await Promise.all([get('/library/scan'), setupPanel()]);
  return `
    ${setup}
    <h2>Your music folder</h2>
    ${scanPanel(scan)}
`;
}

/* ---- interaction ---- */

$('#main').addEventListener('click', onMainClick);

// Creating and renaming are forms, so Enter works and the browser handles focus.
$('#main').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'unlock') {
    setupKey = f.k.value;
    return render();
  }
  if (f.id === 'setup') {
    // A secret is sent only when it was actually typed into. Leaving it out is
    // what keeps the stored value, and testing for "typed" rather than "not
    // empty" is what stops a browser quietly filling a saved password into this
    // form and overwriting what the server holds with it.
    const body = {};
    for (const el of f.querySelectorAll('input[name]')) {
      if (el.type === 'password' && el.dataset.typed !== '1') continue;
      body[el.name] = el.value;
    }
    if (!Object.keys(body).length) return flash('Nothing to save');
    const res = await fetch('/api/settings', {
      method: 'PUT',
      headers: setupKey ? {'X-Plectra-Password': setupKey} : {},
      body: JSON.stringify(body),
    });
    flash(res.ok ? 'Saved' : (await res.text()).trim() || 'Could not save');
    return render();
  }
  const name = f.querySelector('input').value.trim();
  if (!name) return;
  if (f.id === 'newpl') {
    await post('/playlists', {name});
    flash('Playlist created');
  } else if (f.classList.contains('renamepl')) {
    await fetch('/api/playlists/' + f.dataset.id, {
      method: 'PATCH', body: JSON.stringify({name}),
    });
    flash('Playlist renamed');
  }
  render();
});
$('#side').addEventListener('click', onMainClick);

// The dropdown is mounted in the header, not in #main, so it carries its own
// listener rather than widening the main one.
// Keeping focus in the search box means it never blurs, so the blur timer
// never closes the dropdown out from under the click that is landing on it.
drop.addEventListener('mousedown', e => e.preventDefault());

drop.addEventListener('click', async e => {

async function onMainClick(e) {
  // Keeping or queueing a row from a catalogue album. It gets a library row of
  // its own the first time, and behaves like anything else afterwards.
  const keep = e.target.closest('[data-splike], [data-spenq]');
  if (keep) {
    e.stopPropagation();
    const spBtn = keep.closest('li')?.querySelector('[data-sp]');
    if (!spBtn) return;
    const info = JSON.parse(spBtn.dataset.sp);
    let id = info.localId;
    if (!id) {
      const t = await adopt(info);
      if (!t?.id) return flash('That track could not be kept');
      id = info.localId = t.id;
      spBtn.dataset.sp = JSON.stringify(info); // a second click costs no round trip
    }
    if (keep.matches('[data-spenq]')) {
      await post('/player/queue', {trackIDs: [id]});
      return flash('Added to the queue');
    }
    const on = !liked.has(id);
    await (on ? post('/likes/' + id) : del('/likes/' + id));
    on ? liked.add(id) : liked.delete(id);
    keep.innerHTML = on ? ICON.heartFull : ICON.heart;
    keep.setAttribute('aria-pressed', String(on));
    paint();
    return on ? flash('Kept', true) : flash('Let go');
  }

  // A track from a catalogue album: play the local file when there is one,
  // otherwise find it externally and play the best candidate.
  const sp = e.target.closest('[data-sp]');
  if (sp) {
    const info = JSON.parse(sp.dataset.sp);
    // The listing the row came from, in order, so the queue is the album and
    // not one lonely track with nothing to skip to.
    const rows = [...sp.closest('ul').querySelectorAll('[data-sp]')];
    const album = rows.map(b => JSON.parse(b.dataset.sp))
      .map(x => ({title: x.title, artist: x.artist, localId: x.localId || 0}));
    // Where the clicked row actually sits. This used to be hard-coded to zero,
    // which made every row in a catalogue album start the album's first track.
    const at = Math.max(0, rows.indexOf(sp));

    if (info.localId) {
      // A local row still queues the whole album, taking the files it has.
      const ids = album.map(x => x.localId).filter(Boolean);
      if (ids.length === album.length) {
        return post('/player/play', {trackIDs: ids, startIndex: at});
      }
      return post('/player/play', {trackIDs: [info.localId], startIndex: 0});
    }

    const row = sp.closest('li');
    // Exactly one row can be the one playing, so the others give the claim up
    // before this one takes it.
    row?.parentElement?.querySelectorAll('li').forEach(li => {
      li.classList.remove('playing');
      const m = li.querySelector('.meta');
      if (m && m.dataset.mark) m.textContent = m.dataset.mark;
    });

    const mark = row?.querySelector('.meta');
    if (mark) mark.innerHTML = picks;
    const found = await get('/source/find?artist=' + encodeURIComponent(info.artist) +
      '&title=' + encodeURIComponent(info.title));
    if (!found?.length) {
      if (mark) mark.textContent = 'no stream found';
      return;
    }
    // The external source names tracks its own way, often with the uploader's
    // wording. The listener picked a row out of an album listing, so the player
    // shows that album's title and artist, not whatever the stream is called.
    const resp = await post('/source/play', {...found[0],
      title: info.title, artist: info.artist,
      album, albumTitle: info.album || '', startIndex: at});
    if (mark) mark.textContent = resp.ok ? 'playing' : 'could not play';
    if (resp.ok) row?.classList.add('playing');
    return;
  }

  const station = e.target.closest('[data-station]');
  if (station) return post('/radio/play', JSON.parse(station.dataset.station));

  const enq = e.target.closest('[data-enq]');
  if (enq) {
    e.stopPropagation();
    await post('/player/queue', JSON.parse(enq.dataset.enq));
    return flash('Added to the queue');
  }

  const deq = e.target.closest('[data-dequeue]');
  if (deq) {
    await del('/player/queue/' + deq.dataset.dequeue);
    return;
  }

  const pg = e.target.closest('[data-page]');
  if (pg) {
    page = Math.max(0, Number(pg.dataset.page));
    await repaint();
    $('#main').scrollIntoView({block: 'start'});
    return;
  }

  const all = e.target.closest('[data-view-all]');
  if (all) {
    view = all.dataset.viewAll;
    page = 0;
    return render();
  }

  // Likes: play or shuffle the whole list.
  const ids = e.target.closest('[data-playids]');
  if (ids) return post('/player/play', {trackIDs: JSON.parse(ids.dataset.playids), startIndex: 0});

  if (e.target.id === 'likeshuffle') {
    const order = JSON.parse(e.target.dataset.ids);
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    return post('/player/play', {trackIDs: order, startIndex: 0});
  }

  // Rename happens in the row: the name becomes an input, Enter commits.
  const ren = e.target.closest('[data-renamepl]');
  if (ren) {
    const row = ren.closest('li');
    const id = ren.dataset.renamepl;
    row.innerHTML = `<form class="renamepl" data-id="${id}">
      <input value="${esc(ren.dataset.name)}" maxlength="120" autocomplete="off">
      <button class="action primary" type="submit">Save</button>
      <button class="action" type="button" data-cancel>Cancel</button>
    </form>`;
    row.querySelector('input').focus();
    row.querySelector('input').select();
    return;
  }
  if (e.target.matches('[data-cancel]')) return render();

  // Delete asks in the row rather than in a browser dialog.
  const delpl = e.target.closest('[data-delpl]');
  if (delpl) {
    const row = delpl.closest('li');
    const name = row.querySelector('.grow')?.textContent.trim() || 'this playlist';
    row.innerHTML = `<span class="grow">Delete ${esc(name)}?</span>
      <button class="action" data-delyes="${delpl.dataset.delpl}">Delete</button>
      <button class="action" type="button" data-cancel>Keep</button>`;
    return;
  }
  const yes = e.target.closest('[data-delyes]');
  if (yes) {
    await del('/playlists/' + yes.dataset.delyes);
    flash('Playlist deleted');
    return render();
  }

  const arrow = e.target.closest('[data-scroll]');
  if (arrow) {
    const row = arrow.parentElement.querySelector('.grid.row');
    row.scrollBy({left: Number(arrow.dataset.scroll) * (row.clientWidth * 0.85),
                  behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
    return;
  }

  // A catalogue album cannot play until something resolves a stream, so the
  // button opens it and starts the first track from there.
  const pmb = e.target.closest('[data-playmb]');
  if (pmb) {
    e.stopPropagation();
    return openCatalogueAlbum(JSON.parse(pmb.dataset.playmb), true);
  }

  const play = e.target.closest('[data-play]');
  if (play) return post('/player/play', JSON.parse(play.dataset.play));

  // Checked after the card's own buttons, which sit inside it: a click on Play
  // must not also open the album behind it.
  const card = e.target.closest('[data-open-album]');
  if (card) return openAlbum(card.dataset.openAlbum);

  const mb = e.target.closest('[data-open-mb]');
  if (mb) return openCatalogueAlbum(JSON.parse(mb.dataset.openMb));

  const row = e.target.closest('[data-index]');
  if (row) {
    const i = Number(row.dataset.index);
    const src = row.dataset.list === 'queue' ? (state.queue || []) : listing;
    if (!src.length) return;
    const ids = src.map(t => t.id);
    // A radio stream has no library row at all. Sending the queue by id would
    // quietly drop it and start the wrong track, so that one plays on its own.
    if (ids.some(x => !x)) {
      return src[i]?.id ? post('/player/play', {trackIDs: [src[i].id], startIndex: 0}) : undefined;
    }
    return post('/player/play', {trackIDs: ids, startIndex: i});
  }

  const like = e.target.closest('[data-like]');
  if (like) {
    const id = Number(like.dataset.like);
    const on = !liked.has(id);
    await (on ? post('/likes/' + id) : del('/likes/' + id));
    flash(on ? 'Kept' : 'Let go', on);
    return render();
  }

  const open = e.target.closest('[data-open]');
  if (open) {
    playlistID = Number(open.dataset.open);
    page = 0;
    repaint = async () => {
      const mine = claim();
      const rows = (await get('/playlists/' + playlistID)) || [];
      if (stale(mine)) return;
      listing = rows;
      $('#main').innerHTML = pagedList(listing, {playlist: true});
    };
    await repaint();
    return;
  }

  const rm = e.target.closest('[data-remove]');
  if (rm && playlistID) {
    await del(`/playlists/${playlistID}/tracks/${rm.dataset.remove}`);
    listing = (await get('/playlists/' + playlistID)) || [];
    $('#main').innerHTML = pagedList(listing, {playlist: true});
    return;
  }

  if (e.target.id === 'scan') {
    e.target.disabled = true;
    $('#scanwhen').textContent = 'Scanning…';
    await post('/library/scan');
    // Poll until it finishes: a cold library takes a while, and the button
    // should not claim success before the walk is over.
    const tick = setInterval(async () => {
      const s = await get('/library/scan');
      if (s && !s.running) {
        clearInterval(tick);
        render();
      }
    }, 700);
    return;
  }
}

/* ---- right-click menu ---- */

// One toast element, reused. Queueing is silent otherwise and the user has no
// way to tell an "add" from a misclick.
const toast = Object.assign(document.createElement('div'), {className: 'toast', hidden: true});
let toastTimer;
document.body.append(toast);
// Keeping something is the one moment worth marking: the toast wears the
// logo's four colours and throws off a few sparks. Everything else stays plain,
// which is what keeps the marked one meaning anything.
function flash(msg, magical) {
  toast.className = 'toast' + (magical ? ' magic' : '');
  toast.innerHTML = (magical
    ? '<i class="spark s1"></i><i class="spark s2"></i><i class="spark s3"></i><i class="spark s4"></i>'
    : '') + `<span>${esc(msg)}</span>`;
  toast.hidden = false;
  // Restarting the animation needs the element off the screen for a frame.
  if (magical) {
    toast.style.animation = 'none';
    requestAnimationFrame(() => toast.style.animation = '');
  }
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.hidden = true, magical ? 2200 : 1800);
}

$('#q').parentElement.append(drop);

const menu = Object.assign(document.createElement('div'), {className: 'menu', hidden: true});
menu.setAttribute('role', 'menu');
document.body.append(menu);
let menuActions = [];

const closeMenu = () => { menu.hidden = true; menuActions = []; };
addEventListener('pointerdown', e => { if (!menu.contains(e.target)) closeMenu(); });
addEventListener('scroll', closeMenu, true);
addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });

function openMenu(x, y, actions) {
  menuActions = actions;
  menu.innerHTML = actions.map((a, i) =>
    `<button role="menuitem" data-mi="${i}">${esc(a.label)}</button>`).join('');
  menu.hidden = false;
  // Measure after it is laid out, so a menu near the edge folds back inside.
  const r = menu.getBoundingClientRect();
  menu.style.left = Math.min(x, innerWidth - r.width - 8) + 'px';
  menu.style.top = Math.min(y, innerHeight - r.height - 8) + 'px';
  menu.firstElementChild?.focus();
}

menu.addEventListener('click', async e => {
  const b = e.target.closest('[data-mi]');
  if (!b) return;
  const a = menuActions[Number(b.dataset.mi)];
  closeMenu();
  await a?.run();
});

// What a row offers depends on what it is. The queue holds library tracks, so
// external results get a play entry and no queue entry rather than one that
// would fail.
function actionsFor(target) {
  const host = target.closest('.card, li');
  if (!host) return [];
  const acts = [];
  const pick = sel => host.matches(sel) ? host : host.querySelector(sel);

  const alb = pick('[data-open-album]');
  if (alb) acts.push({label: 'Open album', run: () => openAlbum(alb.dataset.openAlbum)});

  const mbc = pick('[data-open-mb]');
  if (mbc) acts.push({label: 'Open album', run: () => openCatalogueAlbum(JSON.parse(mbc.dataset.openMb))});

  const p = pick('[data-play]');
  if (p) {
    const body = JSON.parse(p.dataset.play);
    acts.push({label: 'Play', run: () => post('/player/play', body)});
    acts.push({label: 'Add to queue', run: async () => {
      await post('/player/queue', body);
      flash('Added to the queue');
    }});
  }

  const idx = pick('[data-index]');
  if (idx) {
    const i = Number(idx.dataset.index);
    const inQueue = idx.dataset.list === 'queue';
    const src = inQueue ? (state.queue || []) : listing;
    const t = src[i];
    if (t) {
      acts.push({label: inQueue ? 'Play from here' : 'Play',
        run: () => post('/player/play', {trackIDs: src.map(x => x.id), startIndex: i})});
      if (!inQueue) acts.push({label: 'Add to queue', run: async () => {
        await post('/player/queue', {trackIDs: [t.id]});
        flash('Added to the queue');
      }});
      acts.push({label: liked.has(t.id) ? 'Unlike' : 'Like', run: async () => {
        await (liked.has(t.id) ? del('/likes/' + t.id) : post('/likes/' + t.id));
        render();
      }});
      acts.push({label: 'Add to playlist…', run: () => playlistMenu(t.id)});
      if (inQueue) acts.push({label: 'Remove from queue', run: () => del('/player/queue/' + i)});
      if (playlistID) acts.push({label: 'Remove from playlist', run: async () => {
        await del(`/playlists/${playlistID}/tracks/${t.id}`);
        listing = (await get('/playlists/' + playlistID)) || [];
        $('#main').innerHTML = pagedList(listing, {playlist: true});
      }});
    }
  }

  const st = pick('[data-station]');
  if (st) acts.push({label: 'Play station', run: () => post('/radio/play', JSON.parse(st.dataset.station))});

  const sp = pick('[data-sp]');
  if (sp) {
    const info = JSON.parse(sp.dataset.sp);
    // A row with no file is kept the same way as one with a file: it is given a
    // library row when it is first asked for, and then it is just a track.
    const row = async () => {
      if (info.localId) return info.localId;
      const t = await adopt(info);
      if (!t?.id) return 0;
      info.localId = t.id;
      sp.dataset.sp = JSON.stringify(info);
      return t.id;
    };
    acts.push({label: 'Play', run: () => sp.click()});
    acts.push({label: 'Add to queue', run: async () => {
      const id = await row();
      if (!id) return flash('That track could not be queued');
      await post('/player/queue', {trackIDs: [id]});
      flash('Added to the queue');
    }});
    acts.push({label: info.localId && liked.has(info.localId) ? 'Unlike' : 'Like', run: async () => {
      const id = await row();
      if (!id) return flash('That track could not be kept');
      const on = !liked.has(id);
      await (on ? post('/likes/' + id) : del('/likes/' + id));
      on ? liked.add(id) : liked.delete(id);
      flash(on ? 'Kept' : 'Let go', on);
      repaint();
    }});
    acts.push({label: 'Add to playlist…', run: async () => {
      const id = await row();
      if (!id) return flash('That track could not be filed');
      playlistMenu(id);
    }});
  }

  const dp = pick('[data-delpl]');
  if (dp) acts.push({label: 'Delete playlist', run: async () => {
    await del('/playlists/' + dp.dataset.delpl);
    render();
  }});

  return acts;
}

// A second pass over the same menu rather than a nested one: fewer moving
// parts, and the position is already right.
async function playlistMenu(trackID) {
  const ls = (await get('/playlists')) || [];
  const r = menu.getBoundingClientRect();
  const add = id => post(`/playlists/${id}/tracks`, {trackIDs: [trackID]}).then(() => flash('Filed away', true));
  if (!ls.length) {
    openMenu(r.left, r.top, [{label: 'No playlists yet — make one in Playlists', run: () => {
      view = 'playlists';
      markNav();
      render();
    }}]);
    return;
  }
  openMenu(r.left, r.top, ls.map(pl => ({label: pl.name, run: () => add(pl.id)})));
}

$('#main').addEventListener('contextmenu', e => {
  const acts = actionsFor(e.target);
  if (!acts.length) return; // nothing of ours here: leave the browser's own menu alone
  e.preventDefault();
  openMenu(e.clientX, e.clientY, acts);
});

// An arrow at the end of its row is a control that does nothing, so it turns
// itself off. Delegated and re-run on render, because rows come and go.
function syncArrows() {
  document.querySelectorAll('.row-wrap').forEach(w => {
    const row = w.querySelector('.grid.row');
    const max = row.scrollWidth - row.clientWidth;
    w.querySelector('.rowarrow.left').disabled = row.scrollLeft <= 2;
    w.querySelector('.rowarrow.right').disabled = row.scrollLeft >= max - 2;
  });
}
addEventListener('scroll', e => {
  if (e.target instanceof Element && e.target.matches('.grid.row')) syncArrows();
}, true);

// Rows arrive from several paths — a view render, an album panel, a pager — so
// the arrows are synced when the content changes rather than at each call site.
new MutationObserver(() => syncArrows()).observe($('#main'), {childList: true, subtree: true});
addEventListener('resize', () => syncArrows());

// Two groups of destinations — the bar and the rail — but one current view.
const navButtons = () => document.querySelectorAll('[data-view]');
function markNav() {
  navButtons().forEach(b => b.setAttribute('aria-current', String(b.dataset.view === view)));
}
navButtons().forEach(b => b.onclick = () => {
  view = b.dataset.view;
  page = 0;
  $('#q').value = '';
  closeDrop();
  markNav();
  render();
});

// Radio keeps searching its own directory in place; everything else answers in
// the dropdown, so typing never throws away the screen you were looking at.
$('#q').oninput = () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    if (view === 'radio') {
      page = 0;
      return render();
    }
    suggest($('#q').value.trim());
  }, 300);
};
$('#q').onblur = () => setTimeout(closeDrop, 150); // let a click on a hit land first
addEventListener('keydown', e => { if (e.key === 'Escape') closeDrop(); });

$('#toggle').onclick = () => post(state.playing ? '/player/pause' : '/player/resume');
$('#prev').onclick = () => post('/player/prev');
$('#next').onclick = () => post('/player/next');
$('#shuffle').onclick = () => post('/player/mode', {shuffle: !state.shuffle, repeat: state.repeat || 'off'});
$('#repeat').onclick = () => post('/player/mode', {
  shuffle: !!state.shuffle,
  repeat: {off: 'all', all: 'one', one: 'off'}[state.repeat || 'off'],
});
$('#vol').oninput = e => post('/player/volume', {level: Number(e.target.value)});

$('#like').onclick = async () => {
  const t = state.queue?.[state.index];
  if (!t?.id) return flash('This one is not in your collection, so there is nothing to keep');
  const on = !liked.has(t.id);
  await (on ? post('/likes/' + t.id) : del('/likes/' + t.id));
  on ? liked.add(t.id) : liked.delete(t.id);
  flash(on ? 'Kept' : 'Let go', on);
  paint();
  if (view === 'likes' || view === 'queue') render();
};

/* ---- seeking: click anywhere, or drag the rail ---- */

// While a drag is in flight the rail follows the pointer rather than the
// player, so the handle does not snap back between the seek and the next
// state event.
let dragging = false;
const railEl = $('#rail');

const fractionAt = clientX => {
  const r = railEl.getBoundingClientRect();
  return Math.min(1, Math.max(0, (clientX - r.left) / r.width));
};

const showFraction = f => {
  railEl.firstElementChild.style.setProperty('--progress', f);
  railEl.style.setProperty('--progress', f); // the handle rides the same value
};

railEl.addEventListener('pointerdown', e => {
  const t = state.queue?.[state.index];
  if (!t?.durationMs) return; // unknown duration: seeking would be a guess
  dragging = true;
  railEl.setPointerCapture(e.pointerId);
  showFraction(fractionAt(e.clientX));
});

railEl.addEventListener('pointermove', e => {
  if (dragging) showFraction(fractionAt(e.clientX));
});

const endDrag = e => {
  if (!dragging) return;
  dragging = false;
  const t = state.queue?.[state.index];
  if (t?.durationMs) {
    post('/player/seek', {positionMs: Math.round(fractionAt(e.clientX) * t.durationMs)});
  }
};
railEl.addEventListener('pointerup', endDrag);
railEl.addEventListener('pointercancel', () => { dragging = false; });

// Keyboard seeking, because a rail you can only drag is a rail some people
// cannot use at all.
railEl.addEventListener('keydown', e => {
  const t = state.queue?.[state.index];
  if (!t?.durationMs) return;
  const step = e.shiftKey ? 30000 : 5000;
  if (e.key === 'ArrowRight') post('/player/seek', {positionMs: Math.min(t.durationMs, state.positionMs + step)});
  else if (e.key === 'ArrowLeft') post('/player/seek', {positionMs: Math.max(0, state.positionMs - step)});
  else return;
  e.preventDefault();
});

function paint() {
  const t = state.queue?.[state.index];

  $('#now').textContent = t ? t.title : 'Nothing playing';
  $('.now-artist').innerHTML = t
    ? `${esc(t.artist)} <span class="time" id="elapsed">${mmss(state.positionMs) || '0:00'}</span>` +
      (t.durationMs ? ` <span class="time">/ ${mmss(t.durationMs)}</span>` : '')
    : '';

  // The sleeve beside the transport wears the album's colour, so what is
  // playing is recognisable from the corner of the eye.
  const art = $('#nowart');
  if (t) {
    const hue = hueOf(t.albumId || t.id);
    art.hidden = false;
    // Real artwork when the album has it, the album's colour and initial when
    // it does not — the same sleeve the shelf shows, at transport size.
    const initial = (t.album || t.title || '?').trim()[0] || '?';
    art.className = `np-art hue-${hue}`;
    if (t.albumId && t.hasCover) {
      art.innerHTML = `<img src="/api/cover/${t.albumId}" alt=""
        onerror="this.remove(); this.parentElement.textContent = ${JSON.stringify(initial)}">`;
    } else {
      art.textContent = initial;
    }
  } else {
    art.hidden = true;
  }

  // A drag owns the rail until it ends; state events must not fight it.
  if (!dragging) {
    showFraction(t?.durationMs ? Math.min(1, state.positionMs / t.durationMs) : 0);
  }

  // A track with no file has to be looked up before it can start, and that
  // takes seconds. The button that was pressed becomes the thing that waits,
  // so the wait is where the attention already is.
  const playing = !!state.playing, loading = !!state.loading;
  const toggle = $('#toggle');
  toggle.classList.toggle('loading', loading);
  toggle.disabled = loading;
  toggle.setAttribute('aria-busy', String(loading));
  toggle.innerHTML = loading ? '<i class="spinner" aria-hidden="true"></i>'
    : playing ? ICON.pause : ICON.play;
  // One word for both waits the flag covers — finding a stream, and opening
  // one — because the transport is not told which of them it is in.
  toggle.setAttribute('aria-label',
    loading ? 'Finding it' : playing ? 'Pause' : 'Play');

  $('#shuffle').setAttribute('aria-pressed', String(!!state.shuffle));
  const rep = state.repeat || 'off';
  $('#repeat').setAttribute('aria-pressed', String(rep !== 'off'));
  $('#repeat').setAttribute('aria-label', 'Repeat: ' + rep);

  const isLiked = !!t && liked.has(t.id);
  $('#like').setAttribute('aria-pressed', String(isLiked));
  $('#like').innerHTML = isLiked ? ICON.heartFull : ICON.heart;
  $('#vol').value = state.volume ?? 1;

  paintSide();
}

// The right column is a view of player state, so it exists exactly when the
// state does: nothing loaded, no column, no transport.
function paintSide() {
  const q = state.queue || [];
  const t = q[state.index];
  const live = q.length > 0;

  document.body.classList.toggle('has-queue', live);
  document.body.classList.toggle('has-player', live);
  $('#side').hidden = !live;
  if (!live) return;

  const np = $('#nowplaying');
  if (t) {
    const hue = hueOf(t.albumId || t.id);
    const initial = esc((t.album || t.title || '?').trim()[0] || '?');
    // The same artwork the shelf and the transport show. This panel used to
    // draw the letter sleeve unconditionally, so an album with a cover lost it
    // exactly where it is largest.
    const cover = t.albumId && t.hasCover ? `/api/cover/${t.albumId}` : '';
    np.innerHTML = `
      ${cover
        ? `<span class="sleeve hue-${hue}" aria-hidden="true"><img src="${esc(cover)}" alt=""
             data-initial="${initial}" onerror="emptySleeve(this)"></span>`
        : `<span class="sleeve empty hue-${hue}" aria-hidden="true">${initial}</span>`}
      <div class="np-title">${esc(t.title)}</div>
      <div class="np-artist">${esc(t.artist)}</div>
      ${t.album ? `<div class="np-album">${esc(t.album)}</div>` : ''}`;
    np.hidden = false;
  } else {
    np.hidden = true;
  }

  const from = state.index < 0 ? 0 : state.index;
  const upcoming = q.slice(from + 1);
  $('#queuepanel').innerHTML = `<h2>Next up</h2>
    <p class="meta">${upcoming.length ? `${upcoming.length} ahead of you` : 'End of the queue'}</p>
    <ul>${upcoming.slice(0, 50).map((t, i) => {
      const at = from + 1 + i;
      return `<li>
        <button class="grow" data-index="${at}" data-list="queue">${esc(t.title)}
          <span class="sub">— ${esc(t.artist)}</span></button>
        <button class="icon" data-dequeue="${at}" aria-label="Remove ${esc(t.title)} from queue">&times;</button>
      </li>`;
    }).join('')}</ul>`;
}

// The transport wraps differently at every width; measure it so content is never
// parked underneath it.
const transport = document.querySelector('footer');
const sizeTransport = () =>
  document.documentElement.style.setProperty('--player-h', transport.offsetHeight + 'px');
new ResizeObserver(sizeTransport).observe(transport);
sizeTransport();

// The page is driven entirely by this stream: if it dies, every control still
// responds but nothing on screen ever changes again. So it reconnects, and the
// view is repainted when it comes back.
let events, retry = 0;

function listen() {
  events = new EventSource('/api/events');

  events.onopen = () => {
    if (retry) render(); // whatever happened while we were away is now visible
    retry = 0;
  };

  events.onmessage = e => {
    const ev = JSON.parse(e.data);
    if (ev.type === 'error') return flash(ev.message);
    if (!ev.state) return;
    const prevIndex = state.index, prevLen = state.queue?.length;
    state = ev.state;
    paint();
    if (view === 'queue' && (state.index !== prevIndex || state.queue?.length !== prevLen)) render();
  };

  events.onerror = () => {
    events.close();
    // Backing off to a few seconds: a restarted server is back in one or two.
    retry = Math.min(retry + 1, 6);
    setTimeout(listen, retry * 500);
  };
}
listen();

render();
</script>
